name: Release

# A pushed vX.Y.Z tag publishes a release: the source tarball, .deb, .rpm and
# Arch packages, and the notes from CHANGELOG.md, and updates the AUR. Pull requests that touch packaging,
# and runs started by hand, build the same files without publishing; other pull
# requests skip the builds, and the packages job passes for them.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run; tag runs always finish.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether to build: always for a tag or a run by hand, and for a pull request
  # only when it changes something the packages are made from.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packaging: ${{ steps.files.outputs.packaging }}
    steps:
      - name: Look at what the pull request changes
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          packaging=true
          if [ -n "$PR" ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')"
            grep -qE '^(packaging/|core$|\.gitmodules$|tests/package_smoke\.sh$|CHANGELOG\.md$|\.github/workflows/release\.yml$)' <<<"$files" ||
              packaging=false
          fi
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  source:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check every file names that version
        run: core/tooling/check-version.sh "${{ steps.version.outputs.version }}"

      - name: Write the notes and the source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          core/tooling/release-notes.sh "$version" > notes.md
          core/tooling/source-tarball.sh "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            notes.md
            callie-*.tar.xz
          if-no-files-found: error

  rpm:
    needs: source
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Build the package
        # The Google OAuth client lets the packaged app sign in. A release
        # without one fails to build rather than ship an app that cannot.
        env:
          CALLIE_GOOGLE_CLIENT_ID: ${{ secrets.CALLIE_GOOGLE_CLIENT_ID }}
          CALLIE_GOOGLE_CLIENT_SECRET: ${{ secrets.CALLIE_GOOGLE_CLIENT_SECRET }}
          CALLIE_MICROSOFT_CLIENT_ID: ${{ secrets.CALLIE_MICROSOFT_CLIENT_ID }}
          CALLIE_ZOOM_CLIENT_ID: ${{ secrets.CALLIE_ZOOM_CLIENT_ID }}
          CALLIE_REQUIRE_GOOGLE_CLIENT: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          version="${{ needs.source.outputs.version }}"
          dnf install -y --setopt=install_weak_deps=False rpm-build dnf-plugins-core xz tar
          tar -xf "callie-$version.tar.xz"
          dnf builddep -y "callie-$version/packaging/rpm/callie.spec"
          mkdir -p rpmbuild/SOURCES
          cp "callie-$version.tar.xz" rpmbuild/SOURCES/
          # Link-time optimization doubles the build, so only the published packages get it.
          set --
          [ "$GITHUB_REF_TYPE" = tag ] || set -- --define "_lto_cflags %{nil}"
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" "$@" \
            "callie-$version/packaging/rpm/callie.spec"

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  # Debian's, and Ubuntu's built against Ubuntu's own libraries.
  deb:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            artifact: deb
          - image: ubuntu:26.04
            artifact: deb-ubuntu
    name: deb (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Build the package
        # As for the rpm.
        env:
          CALLIE_GOOGLE_CLIENT_ID: ${{ secrets.CALLIE_GOOGLE_CLIENT_ID }}
          CALLIE_GOOGLE_CLIENT_SECRET: ${{ secrets.CALLIE_GOOGLE_CLIENT_SECRET }}
          CALLIE_MICROSOFT_CLIENT_ID: ${{ secrets.CALLIE_MICROSOFT_CLIENT_ID }}
          CALLIE_ZOOM_CLIENT_ID: ${{ secrets.CALLIE_ZOOM_CLIENT_ID }}
          CALLIE_REQUIRE_GOOGLE_CLIENT: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          version="${{ needs.source.outputs.version }}"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs xz-utils
          tar -xf "callie-$version.tar.xz"
          cp "callie-$version.tar.xz" "callie_$version.orig.tar.xz"
          cd "callie-$version"
          cp -r packaging/debian debian
          . /etc/os-release
          # Ubuntu's version sorts below Debian's, and its file is named apart, so a
          # Callie from before Ubuntu's debs never takes it for Debian.
          if [ "$ID" = ubuntu ]; then
            sed -i "1s/(\([^)]*\))/(\1~ubuntu$VERSION_ID)/" debian/changelog
          fi
          mk-build-deps --install --remove \
            --tool "apt-get -y --no-install-recommends" debian/control
          # As for the rpm, link-time optimization only for a release; Ubuntu turns it on.
          [ "$GITHUB_REF_TYPE" = tag ] || export DEB_BUILD_MAINT_OPTIONS=optimize=-lto
          dpkg-buildpackage -us -uc -b
          if [ "$ID" = ubuntu ]; then
            for deb in ../callie_*.deb; do mv "$deb" "../callie-ubuntu_${deb#../callie_}"; done
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: "*.deb"
          if-no-files-found: error

  # The Arch package, from the AUR's PKGBUILD built against this source, and the
  # PKGBUILDs the AUR gets. Arch moves quickly, so a failure here does not hold
  # back the release; it goes out without an Arch package.
  arch:
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Build the package
        # The same clients as the rpm and deb, from the environment; the AUR's
        # PKGBUILD leaves them out.
        env:
          CALLIE_GOOGLE_CLIENT_ID: ${{ secrets.CALLIE_GOOGLE_CLIENT_ID }}
          CALLIE_GOOGLE_CLIENT_SECRET: ${{ secrets.CALLIE_GOOGLE_CLIENT_SECRET }}
          CALLIE_REQUIRE_GOOGLE_CLIENT: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          version="${{ needs.source.outputs.version }}"
          pacman -Syu --noconfirm --needed base-devel git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          sum="$(sha256sum "callie-$version.tar.xz" | cut -d' ' -f1)"
          # The AUR's copies: the release's version and tarball checksum filled in.
          mkdir -p aur
          cp -r packaging/arch/callie packaging/arch/callie-git aur/
          sed -i -e "s/^pkgver=.*/pkgver=$version/" \
            -e "0,/^sha256sums=('[^']*'/s//sha256sums=('$sum'/" aur/callie/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$version.r0.g0000000/" aur/callie-git/PKGBUILD
          mkdir /build
          cp aur/callie/PKGBUILD "callie-$version.tar.xz" /build/
          chown -R builder /build aur
          for dir in aur/callie aur/callie-git; do
            (cd "$dir" && sudo -u builder makepkg --printsrcinfo | tee .SRCINFO >/dev/null)
          done
          # As for the rpm, link-time optimization only for a release.
          [ "$GITHUB_REF_TYPE" = tag ] || echo 'options=(!lto)' >> /build/PKGBUILD
          cd /build
          sudo -u builder --preserve-env=CALLIE_GOOGLE_CLIENT_ID,CALLIE_GOOGLE_CLIENT_SECRET,CALLIE_REQUIRE_GOOGLE_CLIENT \
            makepkg --syncdeps --noconfirm
          mkdir "$GITHUB_WORKSPACE/pkg"
          cp "callie-$version"-*-x86_64.pkg.tar.zst "$GITHUB_WORKSPACE/pkg/"

      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: pkg/*.pkg.tar.zst
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: aur
          include-hidden-files: true
          if-no-files-found: error

  # The Flatpak, built and tested in its sandbox. Flathub builds the published
  # one, so this does not hold back the release either.
  flatpak:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: callie.flatpak
          manifest-path: packaging/flatpak/org.callieapp.Callie.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

  # Each package installed on a clean system, and run, before it is published.
  installed:
    needs: [rpm, deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
            package: rpm
          - name: debian
            image: debian:trixie
            package: deb
          - name: ubuntu
            image: ubuntu:26.04
            package: deb-ubuntu
    name: installed (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}
          path: packages

      - name: Install the package (Fedora)
        if: matrix.name == 'fedora'
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          $(find packages/RPMS -name 'callie-[0-9]*.rpm')

      # The offscreen platform the check draws with is not one a desktop needs.
      - name: Install the package (Debian and Ubuntu)
        if: matrix.name != 'fedora'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-qpa-plugins $(find ./packages -name 'callie_*.deb' -o -name 'callie-ubuntu_*.deb')

      - name: Run what was installed
        run: tests/package_smoke.sh shots

      - uses: actions/upload-artifact@v7
        with:
          name: installed-${{ matrix.name }}
          path: shots/
          if-no-files-found: error

  # The check to require: it passes when every build above passed or was skipped.
  # Skipped matrix jobs report no check under their own names, so they cannot be
  # required themselves.
  packages:
    if: always()
    needs: [changes, source, rpm, deb, arch, flatpak, installed]
    runs-on: ubuntu-latest
    steps:
      - name: Check the builds
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "a package build did not pass: $RESULTS" >&2
              exit 1
              ;;
          esac
          echo "builds: $RESULTS"

  publish:
    # With the Arch package when it built, and without it when it did not.
    if: >-
      always() && github.ref_type == 'tag' && needs.source.result == 'success' &&
      needs.rpm.result == 'success' && needs.deb.result == 'success' &&
      needs.installed.result == 'success'
    needs: [source, rpm, deb, arch, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Callie ${{ needs.source.outputs.version }}" \
            --notes-file dist/notes.md \
            dist/callie-*.tar.xz $(find dist -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst')

  # The AUR's callie and callie-git, once the release is out. It needs an AUR
  # account's SSH key in AUR_SSH_PRIVATE_KEY; without one it says so and stops.
  aur:
    if: github.ref_type == 'tag'
    needs: [source, arch, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: aur

      - name: Push the PKGBUILDs
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set, so the AUR was not updated."
            exit 0
          fi
          version="${{ needs.source.outputs.version }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "Greylock Labs"
          git config --global user.email hello@greylocklabs.org
          for package in callie callie-git; do
            git clone -q "ssh://aur@aur.archlinux.org/$package.git" "repo-$package"
            cp "aur/$package/PKGBUILD" "aur/$package/.SRCINFO" "repo-$package/"
            (
              cd "repo-$package"
              git add PKGBUILD .SRCINFO
              # The same files again, as when a release is run twice, change nothing.
              git diff --cached --quiet || git commit -q -m "Update to $version"
              git push -q origin HEAD:master
            )
          done
